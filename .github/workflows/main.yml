name: Calculator CI and deployment
on:
  push:
    branches: [main, adminvps-migration]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
        env:
          POSTGRES_DB: calculator_ci
          POSTGRES_USER: calculator_ci
          POSTGRES_PASSWORD: dummy-ci-only
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U calculator_ci -d calculator_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build application and check committed migrations
        env:
          POSTGRES_DB: calculator_ci
          POSTGRES_USER: calculator_ci
          POSTGRES_PASSWORD: dummy-ci-only
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DJANGO_KEY: dummy-ci-key-never-use-in-production
          DEBUG: 'False'
          ALLOWED_HOSTS: collider.hopto.org,127.0.0.1,localhost
        shell: bash
        run: |
          set -euo pipefail
          docker build -t calculator-ci ./calculator
          docker run --rm --network host \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e DB_HOST -e DB_PORT -e DJANGO_KEY -e DEBUG -e ALLOWED_HOSTS \
            calculator-ci sh -ec '
              python manage.py check
              python manage.py makemigrations --check --dry-run
              python manage.py migrate --noinput
              python manage.py migrate --check
              python manage.py collectstatic --noinput
              cp -R /calculator_app/static/. /calculator_app/staticfiles/
              python -c "import os; os.environ.setdefault(\"DJANGO_SETTINGS_MODULE\",\"calculator.settings\"); import django; django.setup(); from django.test import Client; c=Client(HTTP_HOST=\"collider.hopto.org\",HTTP_X_FORWARDED_PROTO=\"https\"); assert all(c.get(p).status_code == 200 for p in [\"/\",\"/auth/login/\",\"/auth/signup/\"])"
            '
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push application
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./calculator
          platforms: linux/amd64
          push: true
          tags: duzer61/calculator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: vars.CALCULATOR_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: calculator-production
      cancel-in-progress: false
    steps:
      - name: Deploy exact image through restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" == 155.212.246.84 ]]
          [[ "$DEPLOY_USER" == calculator-deploy ]]
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/calculator-key.XXXXXX")
          hosts_file=$(mktemp "$RUNNER_TEMP/calculator-hosts.XXXXXX")
          trap 'unlink "$key_file"; unlink "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $IMAGE_DIGEST"
