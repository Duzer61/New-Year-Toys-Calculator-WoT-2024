name: calculator
services:
  db_django:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    env_file: ${CALCULATOR_ENV_FILE:-/srv/projects/calculator/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: {driver: local}
  calculator:
    image: ${CALCULATOR_IMAGE:-duzer61/calculator:latest}
    restart: unless-stopped
    env_file: ${CALCULATOR_ENV_FILE:-/srv/projects/calculator/.env}
    depends_on:
      db_django: {condition: service_healthy}
    volumes:
      - static_volume:/calculator_app/staticfiles
      - media:/media
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/',headers={'Host':'collider.hopto.org'}); urllib.request.urlopen(r,timeout=5).close()"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 12
    logging: {driver: local}
  nginx:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    depends_on:
      calculator: {condition: service_healthy}
    ports: ['127.0.0.1:9000:80']
    volumes:
      - /etc/calculator/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
      - media:/media:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null --header="Host: collider.hopto.org" http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: {driver: local}
volumes:
  pg_data:
  static_volume:
  media:
